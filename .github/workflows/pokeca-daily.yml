# ポケカ話題まとめ: 毎日自動で 収集→要約・感情分析→相場分析→サイト生成 を実行し、docs/ を更新する
name: pokeca-daily

on:
  schedule:
    - cron: "17 13 * * *"   # 毎日 22:17 JST（UTC 13:17）
  workflow_dispatch: {}      # 手動実行ボタン

permissions:
  contents: write

concurrency:
  group: pokeca-daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: pokeca-trends
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pokeca-trends/requirements.txt
      - run: pip install -r requirements.txt
      - name: 収集・分析・サイト生成
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USER_AGENT: ${{ secrets.REDDIT_USER_AGENT }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python main.py run
      - name: 結果をコミット（DBとサイト）
        working-directory: .
        run: |
          git config user.name "pokeca-bot"
          git config user.email "pokeca-bot@users.noreply.github.com"
          git add docs pokeca-trends/data/pokeca.db
          git diff --cached --quiet || git commit -m "daily update $(TZ=Asia/Tokyo date +%F)"
          git push
