# ポケカ話題まとめ: 1日3サイクル
#   収集 → 要約・感情分析 → 相場分析(1日1回) → 自分の投稿の反応回収 → 学習 → 投稿生成・審査 → 投稿 → サイト更新
# ※ GitHub Actions の定期実行は混雑時に数分〜数十分遅れることがあります
name: pokeca-daily

on:
  schedule:
    - cron: "41 22 * * *"   # 07:41 JST（朝の通勤時間帯）
    - cron: "13 3 * * *"    # 12:13 JST（昼休み）
    - cron: "47 10 * * *"   # 19:47 JST（夜）
  workflow_dispatch: {}      # 手動実行ボタン

permissions:
  contents: write

concurrency:
  group: pokeca-daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: pokeca-trends
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pokeca-trends/requirements.txt
      - run: pip install -r requirements.txt
      - name: 収集・分析・サイト生成
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USER_AGENT: ${{ secrets.REDDIT_USER_AGENT }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          TZ: Asia/Tokyo
        run: python main.py cycle
      - name: 結果をコミット（DBとサイト）
        working-directory: .
        run: |
          git config user.name "pokeca-bot"
          git config user.email "pokeca-bot@users.noreply.github.com"
          git add docs pokeca-trends/data/pokeca.db
          git diff --cached --quiet || git commit -m "cycle update $(TZ=Asia/Tokyo date '+%F %H:%M')"
          git push || (git pull --rebase && git push)
