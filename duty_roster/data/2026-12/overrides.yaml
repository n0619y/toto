# assign の結果に対する手修正. コマは "AM, PM, 夜" の順, "=" は自動割り当てのまま.
# 翌月の日は "+1", "+2", ... (12 月表の 1/1〜1/3)
days:
  6:
    仲本: "=, =, 1st"
    佐々木: "=, =, 2nd"
  20:
    仲本: "=, =, 1st"
    佐々木: "=, =, 2nd"
  "+3":
    仲本: "=, =, 1st"
    佐々木: "NICU/1st, NICU/1st, 2nd"   # 1/3 佐々木 NICU日直 (夜は仲本 1st)
  30:
    仲本: "=, =, 小児科/1st"      # 12/30 仲本 小児科当直
  10:
    仲本: "2nd, 2nd, 2nd"            # 12/10-11 1st を入れ替え
    佐々木: "1st, 1st, 1st"
  11:
    仲本: "2nd, =, 1st"              # PM は由利組合のため佐々木のまま
    佐々木: "1st, =, 2nd"
