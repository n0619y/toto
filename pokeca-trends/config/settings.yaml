# =========================================================
# ポケカ話題まとめ 設定ファイル
# =========================================================

claude:
  model: claude-opus-5-5        # 要約・トピック化に使うモデル
  light_model: claude-opus-5-5  # コメント感情分析など大量処理用（コスト重視なら claude-haiku-5-5 などに変更可）
  topic_effort: high            # トピック抽出の思考深度 (low/medium/high/xhigh/max)
  sentiment_effort: low         # 感情分析の思考深度
  max_posts_for_topics: 400     # 1日あたりトピック化に回す投稿数の上限（エンゲージメント上位から）
  max_comments_per_topic: 120   # 1トピックあたり感情分析に回すコメント数の上限

# 収集対象（キーワードは国内/海外で分けて管理）
keywords:
  ja: ["ポケカ", "ポケモンカード", "ポケカ 高騰", "ポケカ 新弾", "ポケカ 買取", "ポケカ 再販"]
  en: ["pokemon tcg", "pokemon cards", "ptcg", "pokemon card pull"]

collectors:
  reddit:
    enabled: true
    subreddits: [PokemonTCG, pkmntcg, pokemoncardcollectors, PokemonTCGDeals, PKMNTCGDeals]
    listing: top          # top / hot / new
    time_filter: day
    limit_per_sub: 50
    comments_per_post: 40
  x:
    enabled: true
    max_results_per_query: 100   # 1クエリあたり（APIプランの月間上限に注意）
    fetch_replies: true          # 返信（コメント）も取得する
    replies_per_post: 30
  threads:
    enabled: true
    limit_per_query: 50
    replies_per_post: 30
  instagram:
    enabled: true
    hashtags: [ポケカ, ポケモンカード, pokemontcg, pokemoncards]   # 7日間で30種類までの制限あり
    limit_per_hashtag: 50

# ランキングのスコア計算の重み
ranking:
  weight_likes: 1.0
  weight_comments: 2.0
  weight_shares: 1.5
  weight_post_count: 3.0
  source_diversity_bonus: 0.25   # 複数SNSで話題になっているほど加点（1媒体増えるごとに+25%）
  top_n: 30

# 買取表の取得元（config/shops.yaml に定義）
market:
  shops_file: config/shops.yaml
  manual_csv_dir: data/buylists   # 手入力/ダウンロードしたCSVを置くと自動取込
  request_interval_sec: 3         # 取得間隔（相手サーバーに負荷をかけない）
  respect_robots_txt: true

site:
  title: ポケカ話題まとめ
  output_dir: ../docs             # GitHub Pages の公開ディレクトリ（リポジトリ直下 docs/）
  base_url: ""                    # 例: /toto  (GitHub Pages のプロジェクトサイトの場合)
  archive_days: 60

# =========================================================
# 自動投稿（バズ投稿の“型”を学習 → オリジナル投稿 → 反応を次に反映）
# =========================================================
autopost:
  enabled: false            # ★ false の間は投稿せず「下書き（dry_run）」として保存だけする。内容を確認してから true に
  platforms: [x, threads]   # Reddit は bot 投稿を禁止するコミュニティが多く、Instagram は画像必須のため対象外
  posts_per_cycle: 1        # 1サイクルで各媒体に投稿する件数
  max_posts_per_day: 4      # 各媒体の1日あたり上限（スパム判定の回避）
  same_topic_cooldown_hours: 24   # 同じ話題は24時間空ける
  candidates: 3             # 1投稿あたり作る候補数（審査に通った中から選ぶ）
  site_url: ""              # 例: https://<ユーザー名>.github.io/toto/ 。設定すると一部の投稿にサイトのリンクを付ける
  link_ratio: 0.3           # リンクを付ける投稿の割合（Xはリンク付き投稿が伸びにくい傾向がある）
  max_hashtags: 2
  # 盗用防止: 元のバズ投稿と「連続一致する文字数」または「文字3-gramの重なり率」がこれ以上なら不採用
  max_copied_chars: 18
  max_similarity_to_source: 0.5
  max_similarity_to_own: 0.6
  # 投稿の「型」。成績に応じて選ばれる頻度が自動で変わる（UCBバンディット）
  archetypes:
    sokuho: 速報・ニュース型（冒頭で要点、事実を短く）
    question: 問いかけ型（事実を伝えた上で読者に意見を聞き、返信を促す）
    matome: 箇条書きまとめ型（要点を2〜4行の箇条書きで）
    souba: 相場数字型（買取価格の動きを具体的な数字で伝える）
    kaigai: 海外の反応紹介型（海外SNSでの話題・反応を日本語で紹介）
    voice: コミュニティの声型（SNS上の賛否の割合や代表的な意見を紹介）
  exploration: 0.8          # 大きいほど成績の分からない型を試す
  feedback:
    min_age_hours: 6        # 投稿からこの時間が経ったら成績を評価
    eval_age_hours: 24      # この時点の数値で型どうしを比較（足りない場合は経過時間で補正）
    max_age_days: 7
